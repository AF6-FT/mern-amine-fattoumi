<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MERN – Amine Fattoumi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Gestion d'éléments</h1>
    <p id="status" role="status" aria-live="polite"></p>

    <form id="item-form">
      <label for="name">Nom</label>
      <input id="name" name="name" type="text" required minlength="2" maxlength="100" />
      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500" rows="3"></textarea>
      <button type="submit">Ajouter</button>
    </form>

    <h2>Éléments</h2>
    <ul id="items" class="grid"></ul>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
